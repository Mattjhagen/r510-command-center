<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" fill="#0f1419"/>

  <!-- Orbital rings -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#4a8fa0" stroke-width="1" opacity="0.3"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#6eb3c4" stroke-width="1.5" opacity="0.5"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#6eb3c4" stroke-width="2"/>

  <!-- Center core -->
  <circle cx="32" cy="32" r="6" fill="#6eb3c4"/>
  <circle cx="32" cy="32" r="4" fill="#0f1419"/>

  <!-- Radar sweep line -->
  <line x1="32" y1="32" x2="32" y2="8" stroke="#6ea87d" stroke-width="2" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Satellites/nodes -->
  <circle cx="32" cy="12" r="2" fill="#c96c6c">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="32" r="2" fill="#d4a574">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="52" r="2" fill="#9884c4">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="14" cy="32" r="2" fill="#6ea87d">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Crosshair -->
  <line x1="32" y1="0" x2="32" y2="10" stroke="#4a8fa0" stroke-width="1" opacity="0.5"/>
  <line x1="32" y1="54" x2="32" y2="64" stroke="#4a8fa0" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="32" x2="10" y2="32" stroke="#4a8fa0" stroke-width="1" opacity="0.5"/>
  <line x1="54" y1="32" x2="64" y2="32" stroke="#4a8fa0" stroke-width="1" opacity="0.5"/>
</svg>
