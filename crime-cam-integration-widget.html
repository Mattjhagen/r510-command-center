<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime Camera Integration Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            font-family: 'Courier New', monospace;
        }

        .widget-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 10px;
        }

        .crime-panel, .camera-panel {
            background: rgba(26, 31, 38, 0.95);
            border: 2px solid #4a8fa0;
            border-radius: 8px;
            padding: 15px;
            max-height: 600px;
            overflow-y: auto;
        }

        .panel-header {
            color: #6eb3c4;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #4a8fa0;
            padding-bottom: 10px;
        }

        .incident-item {
            background: rgba(15, 20, 25, 0.9);
            border-left: 4px solid #c96c6c;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
        }

        .incident-item:hover {
            background: rgba(26, 31, 38, 1);
            border-left-width: 6px;
            transform: translateX(5px);
        }

        .incident-item.active {
            border-left-color: #6ea87d;
            background: rgba(26, 51, 38, 1);
        }

        .incident-type {
            color: #6eb3c4;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .incident-location {
            color: #a8b2bc;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .incident-time {
            color: #7a8694;
            font-size: 10px;
        }

        .camera-item {
            background: rgba(15, 20, 25, 0.9);
            border: 1px solid #4a8fa0;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        .camera-name {
            color: #6eb3c4;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .camera-distance {
            color: #a8b2bc;
            font-size: 10px;
        }

        .camera-feed {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 8px;
            border: 1px solid #4a8fa0;
        }

        .no-data {
            color: #7a8694;
            text-align: center;
            padding: 20px;
            font-size: 12px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f1419;
        }

        ::-webkit-scrollbar-thumb {
            background: #4a8fa0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <div class="crime-panel">
            <div class="panel-header">🚨 Active Incidents</div>
            <div id="incident-list">
                <div class="no-data">Loading incidents...</div>
            </div>
        </div>

        <div class="camera-panel">
            <div class="panel-header">📹 Nearby Cameras</div>
            <div id="camera-list">
                <div class="no-data">Select an incident to view cameras</div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const BRIDGE_API = 'http://100.103.3.35:9000/api';
        const GEV_API = 'http://100.103.3.35:4173/api';
        const REFRESH_INTERVAL = 10000;

        let selectedIncident = null;

        // Initialize
        async function init() {
            await loadIncidents();
            setInterval(loadIncidents, REFRESH_INTERVAL);
        }

        // Load incidents
        async function loadIncidents() {
            try {
                const response = await fetch(`${BRIDGE_API}/incidents`);
                const data = await response.json();
                renderIncidents(data.incidents || []);
            } catch (error) {
                console.error('Failed to load incidents:', error);
                document.getElementById('incident-list').innerHTML =
                    '<div class="no-data">Failed to load incidents</div>';
            }
        }

        // Render incidents
        function renderIncidents(incidents) {
            const container = document.getElementById('incident-list');

            if (!incidents || incidents.length === 0) {
                container.innerHTML = '<div class="no-data">No active incidents</div>';
                return;
            }

            container.innerHTML = incidents.map(incident => `
                <div class="incident-item" onclick='selectIncident(${JSON.stringify(incident).replace(/'/g, "&apos;")})'>
                    <div class="incident-type">${incident.type || 'Unknown'}</div>
                    <div class="incident-location">${incident.location || `${incident.lat}, ${incident.lon}`}</div>
                    <div class="incident-time">${formatTime(incident.timestamp)}</div>
                </div>
            `).join('');
        }

        // Select incident and load cameras
        async function selectIncident(incident) {
            selectedIncident = incident;

            // Highlight selected
            document.querySelectorAll('.incident-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');

            try {
                const response = await fetch(
                    `${BRIDGE_API}/cameras/nearby?lat=${incident.lat}&lon=${incident.lon}&maxDistance=1500`
                );
                const data = await response.json();
                renderCameras(data.cameras || []);
            } catch (error) {
                console.error('Failed to load cameras:', error);
                document.getElementById('camera-list').innerHTML =
                    '<div class="no-data">Failed to load cameras</div>';
            }
        }

        // Render cameras
        function renderCameras(cameras) {
            const container = document.getElementById('camera-list');

            if (!cameras || cameras.length === 0) {
                container.innerHTML = '<div class="no-data">No cameras nearby</div>';
                return;
            }

            container.innerHTML = cameras.slice(0, 4).map(camera => {
                const frameUrl = `${GEV_API}/cctv/frame/${encodeURIComponent(camera.id)}?t=${Date.now()}`;
                return `
                    <div class="camera-item">
                        <div class="camera-name">📹 ${camera.name}</div>
                        <div class="camera-distance">${camera.distance_text || ''}</div>
                        <img src="${frameUrl}"
                             class="camera-feed"
                             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><text x=%2210%22 y=%2250%22 fill=%22%23666%22>OFFLINE</text></svg>'"
                             onload="setTimeout(() => this.src='${frameUrl}&t=' + Date.now(), 5000)">
                    </div>
                `;
            }).join('');
        }

        // Format timestamp
        function formatTime(timestamp) {
            if (!timestamp) return 'Unknown time';
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;

            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
            return date.toLocaleString();
        }

        // Start
        window.addEventListener('load', init);
    </script>
</body>
</html>
