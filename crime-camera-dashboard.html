<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R510 - Crime Camera Command Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e14;
            color: #a8b2bc;
            font-family: 'Courier New', 'Fira Code', monospace;
            overflow: hidden;
            height: 100vh;
        }

        #root {
            display: grid;
            grid-template-rows: 60px 1fr 200px;
            height: 100vh;
            gap: 2px;
        }

        .header {
            background: linear-gradient(135deg, #1a1f26 0%, #0f1419 100%);
            border-bottom: 2px solid #4a8fa0;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            color: #6eb3c4;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(110, 179, 196, 0.5);
        }

        .header-stats {
            display: flex;
            gap: 30px;
            font-size: 11px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            color: #6eb3c4;
            font-weight: bold;
        }

        .stat-label {
            color: #7a8694;
            text-transform: uppercase;
            font-size: 9px;
            letter-spacing: 1px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            gap: 2px;
            overflow: hidden;
        }

        .panel {
            background: #1a1f26;
            border: 1px solid #2a3f4f;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            background: #0f1419;
            padding: 10px 15px;
            border-bottom: 1px solid #4a8fa0;
            font-size: 11px;
            color: #6eb3c4;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        #gods-eye-view {
            width: 100%;
            height: 100%;
            border: none;
        }

        .incident-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .incident-item {
            background: #0f1419;
            border: 1px solid #2a3f4f;
            border-left: 3px solid #c96c6c;
            padding: 10px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .incident-item:hover {
            background: #1a1f26;
            border-left-color: #6ea87d;
        }

        .incident-item.high-priority {
            border-left-color: #d94848;
            animation: pulse-incident 2s infinite;
        }

        @keyframes pulse-incident {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .incident-type {
            color: #6eb3c4;
            font-weight: bold;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .incident-location {
            color: #a8b2bc;
            margin-bottom: 5px;
        }

        .incident-time {
            color: #7a8694;
            font-size: 9px;
        }

        .camera-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .camera-feed {
            position: relative;
            aspect-ratio: 16/9;
            background: #0f1419;
            border: 1px solid #2a3f4f;
            overflow: hidden;
        }

        .camera-feed img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 20, 25, 0.9);
            padding: 5px;
            font-size: 9px;
            color: #6eb3c4;
            border-top: 1px solid #4a8fa0;
        }

        .status-bar {
            background: #0f1419;
            border-top: 2px solid #4a8fa0;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6ea87d;
            box-shadow: 0 0 8px #6ea87d;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6eb3c4;
            font-size: 12px;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f1419;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a3f4f;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a8fa0;
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- Header -->
        <div class="header">
            <div class="header-title">
                🌐 R510 CRIME CAMERA COMMAND CENTER
            </div>
            <div class="header-stats">
                <div class="stat-box">
                    <div class="stat-value" id="incident-count">0</div>
                    <div class="stat-label">Active Incidents</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="camera-count">0</div>
                    <div class="stat-label">Live Cameras</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="last-update">--:--</div>
                    <div class="stat-label">Last Update</div>
                </div>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Incidents Panel -->
            <div class="panel">
                <div class="panel-header">🚨 Active Incidents</div>
                <div class="panel-content" id="incident-list">
                    <div class="loading">Loading incidents...</div>
                </div>
            </div>

            <!-- God's Eye View -->
            <div class="panel">
                <div class="panel-header">🌐 God's Eye View - Live CCTV</div>
                <iframe id="gods-eye-view" src="http://localhost:4173"></iframe>
            </div>

            <!-- Camera Feeds Panel -->
            <div class="panel">
                <div class="panel-header">📹 Selected Cameras</div>
                <div class="panel-content">
                    <div class="camera-grid" id="camera-feeds">
                        <div class="loading">Select an incident to view cameras</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot"></div>
                <span>Bridge: <span id="bridge-status">CHECKING...</span></span>
            </div>
            <div class="status-item">
                <span>God's Eye View: <span id="gev-status">LOADING...</span></span>
            </div>
            <div class="status-item">
                <span>Cameras Online: <span id="cameras-online">0</span></span>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const BRIDGE_API = 'http://localhost:9000/api';
        const GEV_API = 'http://localhost:4173/api';
        const REFRESH_INTERVAL = 10000; // 10 seconds

        let selectedIncident = null;
        let allCameras = [];

        // Initialize
        async function init() {
            console.log('🚀 Initializing Crime Camera Dashboard...');

            // Check bridge status
            await checkBridgeStatus();

            // Load initial data
            await loadIncidents();
            await loadCameras();

            // Start auto-refresh
            setInterval(loadIncidents, REFRESH_INTERVAL);
            setInterval(updateStatus, 5000);

            console.log('✅ Dashboard initialized');
        }

        // Check bridge server status
        async function checkBridgeStatus() {
            try {
                const response = await fetch(`${BRIDGE_API.replace('/api', '')}/status`);
                const data = await response.json();

                document.getElementById('bridge-status').textContent = 'ONLINE';
                console.log('Bridge status:', data);
            } catch (error) {
                document.getElementById('bridge-status').textContent = 'OFFLINE';
                console.error('Bridge not available:', error);
            }
        }

        // Load incidents from bridge
        async function loadIncidents() {
            try {
                const response = await fetch(`${BRIDGE_API}/incidents`);
                const data = await response.json();

                document.getElementById('incident-count').textContent = data.incidents.length;
                renderIncidents(data.incidents);
                updateLastUpdate();
            } catch (error) {
                console.error('Failed to load incidents:', error);
                document.getElementById('incident-list').innerHTML =
                    '<div class="loading" style="color: #c96c6c;">Failed to load incidents</div>';
            }
        }

        // Load camera sources
        async function loadCameras() {
            try {
                const response = await fetch(`${GEV_API}/cctv/sources`);
                const data = await response.json();

                allCameras = data.sources || [];
                document.getElementById('camera-count').textContent = allCameras.length;
                console.log(`Loaded ${allCameras.length} cameras`);
            } catch (error) {
                console.error('Failed to load cameras:', error);
            }
        }

        // Render incident list
        function renderIncidents(incidents) {
            const container = document.getElementById('incident-list');

            if (!incidents || incidents.length === 0) {
                container.innerHTML = '<div class="loading">No active incidents</div>';
                return;
            }

            container.innerHTML = incidents.map(incident => `
                <div class="incident-item ${incident.priority === 'high' ? 'high-priority' : ''}"
                     onclick="selectIncident('${incident.id || incident.case_number}')">
                    <div class="incident-type">${incident.type || 'Unknown'}</div>
                    <div class="incident-location">${incident.location || `${incident.lat}, ${incident.lon}`}</div>
                    <div class="incident-time">${formatTime(incident.timestamp)}</div>
                </div>
            `).join('');
        }

        // Select an incident and show nearby cameras
        async function selectIncident(incidentId) {
            console.log('Selected incident:', incidentId);
            selectedIncident = incidentId;

            try {
                const response = await fetch(`${BRIDGE_API}/incidents`);
                const data = await response.json();
                const incident = data.incidents.find(i =>
                    (i.id || i.case_number) === incidentId
                );

                if (!incident) return;

                // Get nearby cameras
                const camerasResponse = await fetch(
                    `${BRIDGE_API}/cameras/nearby?lat=${incident.lat}&lon=${incident.lon}&maxDistance=1500`
                );
                const camerasData = await camerasResponse.json();

                renderCameraFeeds(camerasData.cameras.slice(0, 4));

                // Notify God's Eye View (if messaging supported)
                notifyGodsEyeView(incident);
            } catch (error) {
                console.error('Failed to load cameras for incident:', error);
            }
        }

        // Render camera feeds
        function renderCameraFeeds(cameras) {
            const container = document.getElementById('camera-feeds');

            if (!cameras || cameras.length === 0) {
                container.innerHTML = '<div class="loading">No cameras nearby</div>';
                return;
            }

            container.innerHTML = cameras.map(camera => `
                <div class="camera-feed">
                    <img src="${camera.url}"
                         alt="${camera.name}"
                         onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><text x=%2250%%22 y=%2250%%22>OFFLINE</text></svg>'"
                         onload="this.parentElement.style.border='1px solid #6ea87d'">
                    <div class="camera-label">
                        📹 ${camera.name}<br>
                        ${camera.distance_text || ''}
                    </div>
                </div>
            `).join('');

            // Auto-refresh camera images every 5 seconds
            setTimeout(() => {
                document.querySelectorAll('.camera-feed img').forEach(img => {
                    const src = img.src;
                    img.src = '';
                    img.src = src + '?t=' + Date.now();
                });
            }, 5000);
        }

        // Notify God's Eye View of selected incident
        function notifyGodsEyeView(incident) {
            const iframe = document.getElementById('gods-eye-view');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({
                    type: 'focus-location',
                    lat: incident.lat,
                    lon: incident.lon,
                    zoom: 16
                }, 'http://localhost:4173');
            }
        }

        // Update status indicators
        async function updateStatus() {
            // Check God's Eye View
            try {
                const response = await fetch(`${GEV_API}/cctv/health`);
                const data = await response.json();

                const onlineCount = data.cameras?.filter(c => c.status === 'ok').length || 0;
                document.getElementById('cameras-online').textContent = onlineCount;
                document.getElementById('gev-status').textContent = 'ONLINE';
            } catch (error) {
                document.getElementById('gev-status').textContent = 'OFFLINE';
            }
        }

        // Format timestamp
        function formatTime(timestamp) {
            if (!timestamp) return 'Unknown time';

            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;

            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;

            return date.toLocaleString();
        }

        // Update last update time
        function updateLastUpdate() {
            const now = new Date();
            document.getElementById('last-update').textContent =
                now.toLocaleTimeString('en-US', { hour12: false });
        }

        // Start the application
        window.addEventListener('load', init);
    </script>
</body>
</html>
