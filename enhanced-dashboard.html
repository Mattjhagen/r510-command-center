<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌐 R510 - ORBITAL COMMAND CENTER - LIVE CAMERAS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            color: #00ff41;
            font-family: 'Courier New', 'Fira Code', 'Consolas', monospace;
            overflow: hidden;
            height: 100vh;
        }

        #root {
            display: grid;
            grid-template-rows: 80px 1fr 150px;
            height: 100vh;
            background: linear-gradient(180deg, #0a0a0a 0%, #000000 100%);
        }

        .header {
            background: linear-gradient(135deg, #001a00 0%, #000000 100%);
            border-bottom: 3px solid #00ff41;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0, 255, 65, 0.3);
        }

        .header-title {
            font-size: 28px;
            color: #00ff41;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(0, 255, 65, 0.8),
                         0 0 30px rgba(0, 255, 65, 0.5);
            animation: glow-pulse 3s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% {
                text-shadow: 0 0 15px rgba(0, 255, 65, 0.8),
                             0 0 30px rgba(0, 255, 65, 0.5);
            }
            50% {
                text-shadow: 0 0 25px rgba(0, 255, 65, 1),
                             0 0 50px rgba(0, 255, 65, 0.7);
            }
        }

        .header-stats {
            display: flex;
            gap: 40px;
        }

        .stat-box {
            text-align: center;
            padding: 5px 15px;
            border: 1px solid #00ff41;
            border-radius: 5px;
            background: rgba(0, 255, 65, 0.1);
        }

        .stat-value {
            font-size: 24px;
            color: #00ff41;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.8);
        }

        .stat-label {
            color: #00ff41;
            text-transform: uppercase;
            font-size: 9px;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .main-view {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 3px;
            padding: 3px;
            overflow: hidden;
        }

        .sidebar {
            background: rgba(0, 10, 0, 0.8);
            border: 2px solid #00ff41;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            background: #001a00;
            padding: 15px;
            border-bottom: 2px solid #00ff41;
            font-size: 14px;
            color: #00ff41;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.8);
        }

        .camera-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .camera-item {
            background: rgba(0, 26, 0, 0.8);
            border: 1px solid #00ff41;
            border-left: 4px solid #00ff41;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
        }

        .camera-item:hover {
            background: rgba(0, 51, 0, 0.9);
            border-left-width: 6px;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
            transform: translateX(5px);
        }

        .camera-item.active {
            background: rgba(0, 77, 0, 1);
            border: 2px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.7);
        }

        .camera-name {
            color: #00ff41;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 5px;
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.8);
        }

        .camera-location {
            color: #00ff41;
            opacity: 0.8;
            font-size: 10px;
        }

        .camera-status {
            display: inline-block;
            margin-top: 5px;
            padding: 2px 6px;
            background: rgba(0, 255, 65, 0.2);
            border: 1px solid #00ff41;
            border-radius: 3px;
            font-size: 9px;
        }

        .main-display {
            display: grid;
            grid-template-rows: 1fr 250px;
            gap: 3px;
        }

        .primary-view {
            background: #000000;
            border: 2px solid #00ff41;
            position: relative;
            overflow: hidden;
        }

        .primary-view img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000000;
        }

        .view-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #00ff41;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }

        .overlay-title {
            color: #00ff41;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.8);
        }

        .overlay-info {
            color: #00ff41;
            opacity: 0.9;
        }

        .camera-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
        }

        .camera-cell {
            position: relative;
            background: #000000;
            border: 2px solid #00ff41;
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        .camera-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-cell-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            padding: 5px;
            font-size: 9px;
            color: #00ff41;
            border-top: 1px solid #00ff41;
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.8);
        }

        .status-bar {
            background: #001a00;
            border-top: 3px solid #00ff41;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            box-shadow: 0 -5px 20px rgba(0, 255, 65, 0.3);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #00ff41;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff41;
            box-shadow: 0 0 10px #00ff41,
                        0 0 20px #00ff41;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.2);
            }
        }

        .status-dot.offline {
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000,
                        0 0 20px #ff0000;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #00ff41;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.8);
        }

        .error-message {
            color: #ff4444;
            padding: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.8);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #000000;
            border: 1px solid #00ff41;
        }

        ::-webkit-scrollbar-thumb {
            background: #00ff41;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00ff77;
            box-shadow: 0 0 10px #00ff41;
        }

        .timestamp {
            font-size: 10px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- Header -->
        <div class="header">
            <div class="header-title">
                🛰️ R510 ORBITAL COMMAND CENTER - LIVE SURVEILLANCE
            </div>
            <div class="header-stats">
                <div class="stat-box">
                    <div class="stat-value" id="camera-count">0</div>
                    <div class="stat-label">Live Cameras</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="online-count">0</div>
                    <div class="stat-label">Online</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="last-update">--:--:--</div>
                    <div class="stat-label">Last Update</div>
                </div>
            </div>
        </div>

        <!-- Main View -->
        <div class="main-view">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">📹 AVAILABLE CAMERAS</div>
                <div class="camera-list" id="camera-list">
                    <div class="loading">INITIALIZING...</div>
                </div>
            </div>

            <!-- Main Display -->
            <div class="main-display">
                <!-- Primary View -->
                <div class="primary-view">
                    <div class="loading">SELECT A CAMERA TO VIEW</div>
                    <img id="primary-camera" style="display:none" />
                    <div class="view-overlay" id="primary-overlay" style="display:none">
                        <div>
                            <div class="overlay-title" id="primary-name">Camera Name</div>
                            <div class="overlay-info" id="primary-location">Location</div>
                        </div>
                        <div class="timestamp" id="primary-timestamp">--:--:--</div>
                    </div>
                </div>

                <!-- Camera Grid -->
                <div class="camera-grid" id="camera-grid">
                    <div class="camera-cell">
                        <div class="loading" style="font-size: 10px;">MULTI-VIEW</div>
                    </div>
                    <div class="camera-cell">
                        <div class="loading" style="font-size: 10px;">DISABLED</div>
                    </div>
                    <div class="camera-cell">
                        <div class="loading" style="font-size: 10px;">SELECT</div>
                    </div>
                    <div class="camera-cell">
                        <div class="loading" style="font-size: 10px;">CAMERAS</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="system-dot"></div>
                <span>SYSTEM: <span id="system-status">INITIALIZING</span></span>
            </div>
            <div class="status-item">
                <span>SERVER: R510 (100.103.3.35)</span>
            </div>
            <div class="status-item">
                <span>CAMERAS ONLINE: <span id="cameras-online">0</span></span>
            </div>
        </div>
    </div>

    <script>
        // Configuration - Update these to match your server
        const SERVER_IP = '100.103.3.35';
        const BRIDGE_API = `http://${SERVER_IP}:9000/api`;
        const GEV_API = `http://${SERVER_IP}:4173/api`;
        const REFRESH_INTERVAL = 5000; // 5 seconds
        const IMAGE_REFRESH = 3000; // 3 seconds

        let allCameras = [];
        let selectedCamera = null;
        let multiViewCameras = [];

        // Initialize
        async function init() {
            console.log('🚀 R510 Orbital Command Center - Initializing...');

            await loadCameras();

            // Start auto-refresh
            setInterval(refreshPrimaryCamera, IMAGE_REFRESH);
            setInterval(updateStatus, 10000);

            console.log('✅ System Operational');
        }

        // Load cameras from API
        async function loadCameras() {
            try {
                const response = await fetch(`${GEV_API}/cctv/sources`);
                const data = await response.json();

                allCameras = data.sources || [];
                document.getElementById('camera-count').textContent = allCameras.length;

                renderCameraList(allCameras);
                updateSystemStatus('OPERATIONAL', true);

                console.log(`Loaded ${allCameras.length} cameras`);
            } catch (error) {
                console.error('Failed to load cameras:', error);
                document.getElementById('camera-list').innerHTML =
                    '<div class="error-message">⚠️ CONNECTION FAILED<br>Check server status</div>';
                updateSystemStatus('OFFLINE', false);
            }
        }

        // Render camera list
        function renderCameraList(cameras) {
            const container = document.getElementById('camera-list');

            if (!cameras || cameras.length === 0) {
                container.innerHTML = '<div class="loading">NO CAMERAS AVAILABLE</div>';
                return;
            }

            // Sort by city and name
            cameras.sort((a, b) => {
                if (a.city !== b.city) return a.city.localeCompare(b.city);
                return a.name.localeCompare(b.name);
            });

            container.innerHTML = cameras.map(camera => `
                <div class="camera-item" onclick="selectCamera('${camera.id}')" id="cam-${camera.id}">
                    <div class="camera-name">📹 ${camera.name}</div>
                    <div class="camera-location">${camera.city || 'Unknown'}</div>
                    <div class="camera-status">${camera.provider || 'Unknown Source'}</div>
                </div>
            `).join('');
        }

        // Select a camera
        function selectCamera(cameraId) {
            const camera = allCameras.find(c => c.id === cameraId);
            if (!camera) return;

            selectedCamera = camera;

            // Update UI
            document.querySelectorAll('.camera-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`cam-${cameraId}`)?.classList.add('active');

            // Show primary camera
            const img = document.getElementById('primary-camera');
            const overlay = document.getElementById('primary-overlay');

            img.style.display = 'block';
            overlay.style.display = 'flex';

            // Get frame URL
            const frameUrl = `${GEV_API}/cctv/frame/${encodeURIComponent(cameraId)}?t=${Date.now()}`;
            img.src = frameUrl;

            // Update overlay
            document.getElementById('primary-name').textContent = camera.name;
            document.getElementById('primary-location').textContent =
                `${camera.city || 'Unknown'} - ${camera.provider || 'Unknown'}`;
            updatePrimaryTimestamp();

            console.log('Selected camera:', camera.name);
        }

        // Refresh primary camera image
        function refreshPrimaryCamera() {
            if (!selectedCamera) return;

            const img = document.getElementById('primary-camera');
            if (!img || img.style.display === 'none') return;

            const frameUrl = `${GEV_API}/cctv/frame/${encodeURIComponent(selectedCamera.id)}?t=${Date.now()}`;
            img.src = frameUrl;
            updatePrimaryTimestamp();
        }

        // Update timestamp
        function updatePrimaryTimestamp() {
            const now = new Date();
            document.getElementById('primary-timestamp').textContent =
                now.toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('last-update').textContent =
                now.toLocaleTimeString('en-US', { hour12: false });
        }

        // Update system status
        function updateSystemStatus(status, online) {
            document.getElementById('system-status').textContent = status;
            const dot = document.getElementById('system-dot');

            if (online) {
                dot.classList.remove('offline');
            } else {
                dot.classList.add('offline');
            }
        }

        // Update status indicators
        async function updateStatus() {
            try {
                const response = await fetch(`${GEV_API}/cctv/health`);
                const data = await response.json();

                const onlineCount = data.cameras?.filter(c => c.status === 'ok').length || 0;
                document.getElementById('online-count').textContent = onlineCount;
                document.getElementById('cameras-online').textContent = onlineCount;

                updateSystemStatus('OPERATIONAL', true);
            } catch (error) {
                console.error('Status update failed:', error);
                updateSystemStatus('DEGRADED', false);
            }
        }

        // Start the application
        window.addEventListener('load', init);

        // Auto-select first camera after load
        setTimeout(() => {
            if (allCameras.length > 0) {
                selectCamera(allCameras[0].id);
            }
        }, 2000);
    </script>
</body>
</html>
